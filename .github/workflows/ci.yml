# SPDX-License-Identifier: GPL-3.0-or-later
# Every check a change to master must pass, in one workflow, so one job ("CI passed") can
# stand for all of them in branch protection. It runs on every pull request (any base
# branch), on pushes to master and tags, and by hand (Actions > ci > Run workflow) for a
# branch without a PR. What ships is the Blender add-on: the job "addon" builds, tests and
# uploads its zips (Linux, Windows, macOS). On a v* tag the job "release" then puts the zips of
# that same run into a DRAFT GitHub release (docs/RELEASING.md); a person publishes it.
#
# GitHub starts no pull_request run while a PR has merge conflicts, so a conflicted PR
# shows "CI passed" as missing, never as green.
name: ci

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

# Read-only token for every job; nothing here writes to the repo (artifacts and caches
# don't need token scopes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the macOS job runs. GitHub's macOS runners are the scarce ones (a job can
  # wait in the queue for many minutes), so a pull request that changes only
  # documentation skips it; everything else runs it. Fail-closed: documentation is
  # docs/ and the Markdown files at the top level or directly in addon/, nothing else
  # (Markdown in thirdparty/ or addon/quadami/ can end up in the zip); a rename counts
  # as both its paths. The decision is ci/docs_only.sh, tested in qt-app (ci/tests).
  # Pushes, tags and manual runs always run the macOS job.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      # The PR's merge commit and its first parent, the base it is tested against.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "$EVENT: run everything"
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rev-parse --verify HEAD^2 > /dev/null  # a merge commit, or fail
          ci/docs_only.sh HEAD^1 HEAD

  format:
    name: format (clang-format 23)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Pinned: clang-format releases disagree on some layouts, so "latest" can turn a
      # formatted tree red. Bump deliberately, together with any reformat it needs.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: python -m pip install clang-format==23.1.3
      - name: Run clang-format
        run: sh ci/lint.sh
      - name: Check for changes
        run: git diff --ignore-space-at-eol --exit-code

  # The Qt app (qmake) and the ar_bench driver, each smoke-tested on a sphere.
  qt-app:
    name: qt-app (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only what autoremesher.pro uses (QT += core widgets opengl): no Qt tools or SVG.
      - name: Install dependencies
        run: |
          ci/apt_install.sh build-essential cmake qt5-qmake qtbase5-dev libqt5opengl5-dev \
            libtbb-dev libgl1-mesa-dev
          g++ --version | head -n 1; qmake --version | tail -n 1; cmake --version | head -n 1

      - name: Build Qt app
        run: |
          mkdir -p build/app
          cd build/app
          qmake ../../autoremesher.pro
          make -j"$(nproc)"

      - name: Build Qt-free core (ar_bench)
        run: |
          cmake -S tools/bench/bench -B build/core -DAR_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build/core -j"$(nproc)"

      - name: Smoke test, Qt app headless
        run: ci/smoke_test.sh build/app/autoremesher build/smoke-app

      - name: Smoke test, core
        run: ci/smoke_test.sh build/core/ar_bench build/smoke-core

      # The A/B harness's metrics give the same numbers with and without their input cache.
      - name: Bench tools tests
        run: |
          python3 -m venv build/bench-venv
          build/bench-venv/bin/pip install -q numpy==2.5.4 scipy==1.18.1 libigl==2.6.3 DracoPy==2.2.0
          build/bench-venv/bin/python -m unittest discover -s tools/bench/tests -v

      # The decision of ci/rerun_dropped.py (rerun-dropped.yml runs it from master only).
      - name: CI script tests
        run: python3 -m unittest discover -s ci/tests -v

      - name: Upload smoke test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-output
          path: |
            build/smoke-app/
            build/smoke-core/
          if-no-files-found: ignore

  # The core, the Qt-free CLI (autoremesher-cli) and the Blender add-on on Linux,
  # Windows and macOS, all on one build per platform, the one that ships: build the
  # core, CLI and core tests with CMake, run the core tests and the output gate, run
  # the add-on's worker tests against the CLI, package the extension zip with the CLI
  # bundled, install that zip into a real Blender and remesh a sphere through it in
  # background mode. One job per platform, so a PR needs one macOS runner, not two.
  # Every zip is self-contained (static oneTBB, no DLLs or dylibs outside the OS) and
  # uploaded as the artifact addon-<platform>. Linux builds in an AlmaLinux 8 container
  # (ci/build_linux_portable.sh, glibc 2.28 like Blender 4.2) and tests on the Ubuntu host.
  addon:
    name: addon (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux checks the oldest Blender the manifest allows, Windows and macOS a
          # current release (what a new install gets).
          - os: ubuntu-24.04
            platform: linux-x64
            blender: 4.2.23
            blender_file: blender-4.2.23-linux-x64.tar.xz
            blender_sha256: bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
            cmake_args: ''  # as addon-macos, which sets it; ci/build_linux_portable.sh sets its own
            ship: true
          - os: windows-latest
            platform: windows-x64
            blender: 5.2.2
            blender_file: blender-5.2.2-windows-x64.zip
            blender_sha256: 3849d17a682cba006075aaa3f3597ecb5c9c30ec31035b2e092c53e40679b535
            ship: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: &addon-defaults
      run:
        shell: bash
    env: &addon-env
      SOURCE_COMMIT: ${{ github.sha }}
      CMAKE_ARGS: ${{ matrix.cmake_args }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps: &addon-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r ci/requirements.txt
          if [ "$RUNNER_OS" = Linux ]; then
            # The X and GL libraries Blender links even in background mode. No libtbb: the
            # program must not need it.
            ci/apt_install.sh libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 \
              libsm6 libgl1 libegl1
          fi
          cmake --version | head -n 1

      # Windows: oneTBB is built from source and linked statically, with the
      # static C++ runtime (/MT); see CMakeLists.txt. macOS: static oneTBB too
      # (CMAKE_ARGS from the matrix). Linux: in AlmaLinux 8 with static oneTBB
      # (ci/build_linux_portable.sh); the binaries then run on this host.
      # Build id (cmake/BuildId.cmake): a PR run builds GitHub's merge commit, which
      # is in no branch, so its zip names the PR and its head commit instead; a tag
      # run puts the tag in front ("v0.1.0 abc1234 2026-11-02"), checked by "release".
      - name: Build the core, CLI and tests
        run: |
          build_id=""
          if [ -n "$PR_HEAD" ]; then build_id="pr$PR_NUMBER ${PR_HEAD:0:7}+master"; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            build_id="$GITHUB_REF_NAME $(git log -1 --abbrev=7 --format='%h %cs')"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            JOBS=4 ci/build_linux_portable.sh "$build_id"
          else
            # shellcheck disable=SC2086  # CMAKE_ARGS holds several arguments
            cmake -S . -B build/cli -DCMAKE_BUILD_TYPE=Release -DAUTOREMESHER_BUILD_TESTS=ON $CMAKE_ARGS \
              "-DAUTOREMESHER_BUILD_ID=$build_id"
            cmake --build build/cli --config Release --parallel 4
            cmake --install build/cli --config Release --prefix build/cli-install
          fi
          ls -l build/cli-install/bin build/cli-install/licenses
          cli=build/cli-install/bin/autoremesher-cli
          if [ "$RUNNER_OS" = Windows ]; then cli="$cli.exe"; fi
          echo "CLI=$cli" >> "$GITHUB_ENV"

      # --no-tests=error: a configuration that registers no tests fails instead of passing.
      # A registered test whose executable is missing fails as "Not Run". -C: Windows
      # builds are multi-config.
      - name: Core tests
        run: ctest --test-dir build/cli -C Release --output-on-failure --no-tests=error

      # On the installed CLI, the one that goes into the zip.
      - name: Output gate
        run: python ci/output_gate.py "$CLI" build/gate

      - name: Upload gate output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-output-${{ matrix.platform }}
          path: build/gate/
          if-no-files-found: ignore

      - name: Check the DLLs it needs
        if: runner.os == 'Windows'
        run: python ci/check_dll_imports.py "$CLI"

      # glibc 2.28 and GCC 8's libstdc++ at most, no other shared library.
      - name: Check the Linux libraries it needs
        if: runner.os == 'Linux'
        run: python ci/check_linux_libs.py "$CLI"

      # Only macOS's own libraries, and the deployment target the matrix asks for.
      - name: Check the libraries it needs
        if: runner.os == 'macOS'
        run: |
          otool -L "$CLI"
          if otool -L "$CLI" | awk 'NR > 1 { print $1 }' | grep -v -E '^(/usr/lib/|/System/)'; then
            echo "ERROR: $CLI links libraries outside macOS"; exit 1
          fi
          minos=$(otool -l "$CLI" | awk '$1 == "minos" { print $2; exit }')
          echo "minimum macOS: $minos"
          [ "$minos" = 11.2 ] || { echo "ERROR: expected minimum macOS 11.2"; exit 1; }

      - name: CLI arguments
        run: |
          "$CLI" --version
          "$CLI" --help
          status=0; "$CLI" --target-quads 10 || status=$?
          [ "$status" = 1 ] || { echo "expected exit status 1 without --input, got $status"; exit 1; }

      # Includes the 16k-triangle sphere remesh (1,200-2,400 quads for a target
      # of 2,000), cancel through stdin and a temporary folder with non-ASCII
      # characters in its path.
      - name: Worker tests
        run: |
          export AUTOREMESHER_EXECUTABLE="$CLI"
          python -m unittest discover -s addon/tests -v

      - name: Package the extension
        id: package
        run: |
          zip=$(python addon/package.py --cli-prefix build/cli-install --platform ${{ matrix.platform }})
          python -c "import sys, zipfile; [print(i.filename, i.file_size) for i in zipfile.ZipFile(sys.argv[1]).infolist()]" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Cache Blender ${{ matrix.blender }}
        id: blender-cache
        # Safe on tag runs too: only the test Blender is cached, and it is checked by
        # SHA-256 below before use; nothing from the cache goes into the zip.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: blender-download/${{ matrix.blender_file }}
          key: ${{ matrix.blender_file }}

      - name: Download Blender ${{ matrix.blender }}
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          series=$(echo "${{ matrix.blender }}" | cut -d. -f1-2)
          mkdir -p blender-download
          curl -fsSL --retry 3 -o "blender-download/${{ matrix.blender_file }}" \
            "https://download.blender.org/release/Blender$series/${{ matrix.blender_file }}"

      # Checked on every run, cached or not, against the sum in blender-<version>.sha256
      # next to the download (copied into the matrix when the version is bumped).
      - name: Verify Blender ${{ matrix.blender }}
        run: |
          sum="${{ matrix.blender_sha256 }}  blender-download/${{ matrix.blender_file }}"
          if command -v sha256sum > /dev/null; then echo "$sum" | sha256sum -c -
          else echo "$sum" | shasum -a 256 -c -; fi

      - name: Unpack Blender
        run: |
          mkdir -p blender
          case "${{ matrix.blender_file }}" in
            *.zip) 7z x -y -oblender "blender-download/${{ matrix.blender_file }}" > /dev/null ;;
            *.dmg)
              hdiutil attach -nobrowse -readonly -mountpoint "$PWD/blender-dmg" \
                "blender-download/${{ matrix.blender_file }}" > /dev/null
              cp -R blender-dmg/Blender.app blender/
              hdiutil detach "$PWD/blender-dmg" > /dev/null ;;
            *) tar -xJf "blender-download/${{ matrix.blender_file }}" -C blender ;;
          esac
          if [ "$RUNNER_OS" = macOS ]; then exe=blender/Blender.app/Contents/MacOS/Blender
          else exe=$(find blender -maxdepth 2 -type f \( -name blender.exe -o -name blender \) | head -n 1); fi
          echo "BLENDER=$PWD/$exe" >> "$GITHUB_ENV"

      # Installs the zip the way "Install from Disk..." does, then runs the
      # installed copy with its bundled remesher (no AUTOREMESHER_EXECUTABLE).
      - name: Install the zip in Blender and remesh
        run: |
          "$BLENDER" --version | head -n 1
          "$BLENDER" --command extension validate "${{ steps.package.outputs.zip }}"
          "$BLENDER" --command extension install-file -r user_default -e "${{ steps.package.outputs.zip }}"
          "$BLENDER" -b --factory-startup --python-exit-code 1 \
            --python addon/tests/blender_smoke.py -- --installed

      # The panel as Blender draws it, in a window on a virtual X display with
      # software OpenGL: a result with missing thin parts at UI scale 1 and 1.5,
      # uploaded as panel-linux-x64 for a person to check for cut-off text.
      - name: Panel screenshots
        if: runner.os == 'Linux'
        run: |
          ci/apt_install.sh xvfb xauth libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1600x900x24" "$BLENDER" --factory-startup \
            --python addon/tests/blender_panel_shot.py -- --out build/panel
          test -s build/panel/panel-1.png && test -s build/panel/panel-1.5.png

      - name: Upload the panel screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-linux-x64
          path: build/panel/
          if-no-files-found: ignore

      - name: Upload the extension zip
        if: matrix.ship
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-${{ matrix.platform }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  # The add-on on macOS: the addon job's steps, in a job of its own so that the job,
  # not a step, is skipped and no macOS runner is requested on documentation-only
  # PRs (see "changes"). Literal name: a skipped job never expands its matrix, so an
  # expression here would show unexpanded as the check name.
  addon-macos:
    name: addon (macos-arm64)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    strategy:
      matrix:
        include:
          # Apple silicon only (GitHub's Intel macOS runners are being retired). Static
          # oneTBB, and macOS 11.2 as the oldest target, the minimum of Blender 4.2.
          - os: macos-latest
            platform: macos-arm64
            blender: 5.2.2
            blender_file: blender-5.2.2-macos-arm64.dmg
            blender_sha256: dc4125399b8bfefe283cc1624d6cfc7809d1cac20ace51072127eb371f31f210
            cmake_args: -DAUTOREMESHER_BUNDLED_TBB=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.2
            ship: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: *addon-defaults
    env: *addon-env
    steps: *addon-steps

  # The one check branch protection requires. Green only when every job above
  # succeeded: a failed, cancelled or skipped job turns it red. The one exception is
  # the macOS job skipped on purpose because "changes" found only documentation.
  # The website (tools/site/README.md): its builder's tests, then a full build with the real
  # release list, which fails on any broken link, upstream link outside the credits page, image
  # outside the published folders or private path. The built site is uploaded for a preview;
  # pages.yml deploys it from master.
  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the Markdown renderer
        run: python -m pip install --require-hashes --no-deps -r tools/site/requirements.txt
      - name: Test the builder
        run: python -m unittest discover -s tools/site/tests -v
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/site/build.py --out build/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: build/site
          retention-days: 14

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, format, qt-app, addon, addon-macos, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job
        env:
          RESULTS: ${{ toJSON(needs) }}
          MACOS: ${{ needs.changes.outputs.macos }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          results = {job: r["result"] for job, r in json.load(sys.stdin).items()}
          skippable = {"addon-macos"} if os.environ["MACOS"] == "false" else set()
          bad = {job: result for job, result in results.items()
                 if result != "success" and not (job in skippable and result == "skipped")}
          for job, result in sorted(results.items()):
              print("%s: %s%s" % (job, result, "  <- not allowed" if job in bad else ""))
          sys.exit(1 if bad else 0)'

  # A tag v<version>[-<suffix>] (docs/RELEASING.md): once every job above succeeded, put the
  # three zips of this run, SHA256SUMS.txt and notes from docs/releases/ into a DRAFT release
  # (a pre-release when the tag has a suffix). Kajetan reviews and publishes it by hand.
  # A macOS job dropped without a runner turns "CI passed" red, so this is skipped; the
  # re-run by rerun-dropped.yml re-runs the failed jobs and this one with them. A release
  # that is already published is never touched; a draft is updated in place.
  release:
    name: release (draft)
    needs: [ci-passed]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create or update the draft release
      actions: read        # this run's artifacts
      id-token: write      # Sigstore signing certificate for the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the previous release tag, for the "changes since" link

      - name: Check the tag and its notes
        id: tag
        run: python3 ci/release.py check-tag "$GITHUB_REF_NAME"

      # The newest artifact of each name: a re-run attempt uploads its own.
      - name: Download this run's zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release-in build/release
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("addon-")) | select(.expired | not)
                  | [.name, .id, .created_at] | @tsv' | sort -k1,1 -k3,3r | sort -s -u -k1,1 > artifacts.tsv
          cat artifacts.tsv
          while IFS="$(printf '\t')" read -r name id _; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "build/$name.zip"
            unzip -o -q "build/$name.zip" -d build/release-in
          done < artifacts.tsv
          ls -l build/release-in

      - name: Verify the zips and write the notes
        run: |
          python3 ci/release.py verify "$GITHUB_REF_NAME" build/release-in
          python3 ci/release.py notes "$GITHUB_REF_NAME" build/release-in "$GITHUB_SHA" build/release
          cat build/release/SHA256SUMS.txt
          cat build/release/notes.md >> "$GITHUB_STEP_SUMMARY"

      # Signed build provenance (SLSA, Sigstore) for each zip, stored by GitHub: anyone can
      # check that a download was built by this workflow from this commit with
      # `gh attestation verify <zip> -R KajetanMuczynski/quadami`. One per digest, so a re-run
      # of the same zips adds a second, identical statement and nothing breaks.
      - name: Attest the zips
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: build/release/SHA256SUMS.txt

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          files=(build/release-in/*.zip build/release/SHA256SUMS.txt)
          title="Quadami $GITHUB_REF_NAME"
          if draft=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "ERROR: release $GITHUB_REF_NAME is already published; not touching it"; exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$title" \
              --notes-file build/release/notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$title" --notes-file build/release/notes.md --prerelease="$PRERELEASE" "${files[@]}"
          fi
          echo "Draft release: $(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json url --jq .url)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
