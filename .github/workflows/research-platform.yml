# SPDX-License-Identifier: GPL-3.0-or-later
# Research only (platform divergence study, 2026-10-26); removed from the branch before its PR.
# Runs on a push to the research branch: per platform, de6ac3a (release-check #5's candidate)
# built as release-check did, run twice on 65 cases, and the same with bit hashes of every stage
# (tools/research-platform/research-hash.patch) plus per-platform interventions; the math functions
# of the C library each build links, against correctly rounded values. Everything the analysis
# needs is in the log.
name: research-platform
run-name: research (platform divergence), not a release check

on:
  push:
    branches: [claude/project-thread-nuvq5o]
    paths:
      - .github/workflows/research-platform.yml
      - tools/research-platform/**

permissions:
  contents: read

concurrency:
  group: research-platform
  cancel-in-progress: true

jobs:
  meshes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Fetch and generate the meshes
        run: |
          python -m pip install -q numpy==2.5.4 scipy==1.18.1 manifold3d==3.5.4 scikit-image==0.26.0
          tools/bench/fetch_meshes.sh build/meshes
          python tools/bench/make_synthetic.py --downloads build/meshes/downloads --out build/meshes/synthetic

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-meshes
          path: build/meshes/
          retention-days: 3

  run:
    name: run (${{ matrix.platform }})
    needs: meshes
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x64, os: ubuntu-24.04, jobs: 4, cmake: ''}
          - {platform: windows-x64, os: windows-latest, jobs: 4, cmake: ''}
          - {platform: macos-arm64, os: macos-latest, jobs: 3, cmake: '--cmake-arg=-DCMAKE_OSX_DEPLOYMENT_TARGET=11.2'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Packages
        run: python -m pip install -q numpy==2.5.4 mpmath==1.3.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research-meshes
          path: ${{ runner.temp }}/ar-work/meshes

      - name: Machine
        run: |
          python -c "import platform, os; print('MACHINE', platform.platform(), platform.machine(), platform.processor(), os.cpu_count())"
          if [ "$RUNNER_OS" = Linux ]; then grep -m1 'model name' /proc/cpuinfo; grep -o -w 'fma\|avx2\|avx512f' /proc/cpuinfo | sort | uniq -c; fi
          if [ "$RUNNER_OS" = macOS ]; then sysctl -n machdep.cpu.brand_string; fi
          if [ "$RUNNER_OS" = Windows ]; then powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"; fi

      - name: Experiment
        env:
          AR_WORK: ${{ runner.temp }}/ar-work
        run: python tools/research-platform/experiment.py --platform ${{ matrix.platform }} --jobs ${{ matrix.jobs }} ${{ matrix.cmake }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: research-${{ matrix.platform }}
          path: ${{ runner.temp }}/ar-work/research/
          if-no-files-found: ignore
          retention-days: 30
