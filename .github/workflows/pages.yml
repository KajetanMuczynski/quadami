# Builds the website (tools/site/) and deploys it to GitHub Pages. Needs Settings > Pages >
# Build and deployment > Source: "GitHub Actions" (until then the deploy job fails; nothing else
# does). The same build runs as the "site" job of ci.yml on every PR, so master is already checked.
#
# Runs on a push to master that changes a page source, on a published, edited or removed
# release (the home page shows the latest release), and by hand. The site is always built from
# master: a release event only starts a run on master, since the github-pages environment
# accepts deployments from master only and a release run would be on its tag.
name: pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tools/site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Workflows started with the job token do run when they are started by workflow_dispatch.
  redispatch:
    name: start a run on master
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master

  build:
    name: build
    if: github.event_name != 'release' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the Markdown renderer
        run: python -m pip install --require-hashes --no-deps -r tools/site/requirements.txt
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/site/build.py --out build/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
