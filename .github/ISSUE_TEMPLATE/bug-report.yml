# Bug report form. Asks for what docs/USER-GUIDE.md §9 "Reporting a problem" lists, so a report can
# be reproduced without a round of questions.
name: Bug report
description: Something went wrong, the result is broken, or the add-on does not work.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Check the [user guide's troubleshooting](https://kajetanmuczynski.github.io/quadami/guide/#9-troubleshooting) first.

        **Everything here is public.** Do not attach a model you are not allowed to share, or one that
        shows a real person. Without the model, the build line, settings and result rows are often enough.
        A security problem goes to [a private report](https://github.com/KajetanMuczynski/quadami/security/advisories/new) instead.
  - type: input
    id: build
    attributes:
      label: Build line
      description: The grey line at the very bottom of the Quadami panel, e.g. "Add-on build 4e9cdc7 2026-10-21". Write "none" if there is no such line.
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender version
      description: Help > About Blender, or the version at the bottom right of the window, e.g. "4.5.3 LTS". Say if it is the snap, Steam or another package.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS (Apple silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: System details
      description: Optional. Version and distribution, e.g. "Ubuntu 24.04" or "Windows 11 23H2".
  - type: input
    id: target
    attributes:
      label: Target Quads
      description: The Target Quads value of the run that went wrong.
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Other settings
      description: Fast or Quality, and anything you changed under Advanced. "defaults" if nothing.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got. Screenshots help; drag them here.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Result box
      description: The box under Remesh after the run (title, red rows, warnings). Type its rows or attach a screenshot.
    validations:
      required: true
  - type: dropdown
    id: folded
    attributes:
      label: Folded input
      description: 'Did the result show the warning "Folded input: N faces in K spots"?'
      options:
        - "No warning"
        - "Warning shown, did not press Repair Folds and Re-run"
        - "Warning shown, the problem stays after Repair Folds and Re-run"
        - "Not sure / the run failed"
    validations:
      required: true
  - type: textarea
    id: worker
    attributes:
      label: Remesher output
      description: Optional. Start Blender from a terminal (Windows - Window > Toggle System Console) and paste the text after "Quadami worker output:".
      render: text
  - type: textarea
    id: model
    attributes:
      label: Model
      description: Optional. What kind of model it is (sculpt, scan, CAD, joined pieces ...), its face count, and a link or attachment only if you may share it publicly. You can also say you could send it privately.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use the newest build I could find, or I say above why not.
          required: false
        - label: Nothing I attached is private or shows a real person.
          required: true
